[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "littrail"
version = "0.1.0"
description = "CLI tool for managing a verified literature trail from AI-generated research reports"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "pyalex>=0.15",
    "ruamel.yaml>=0.18",
]

[project.scripts]
littrail = "littrail.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pyright>=1.1",
    "build>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/littrail"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
